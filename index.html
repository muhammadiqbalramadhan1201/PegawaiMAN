<!DOCTYPE html>

<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>Aplikasi Pegawai MAN</title>

  <!-- Preview WhatsApp & Open Graph -->

  <meta property="og:title" content="Aplikasi Pegawai MAN">
  <meta property="og:description" content="Sistem informasi dan layanan kepegawaian.">
  <meta property="og:image" content="https://muhammadiqbalramadhan1201.github.io/PegawaiMAN/preview.png">
  <meta property="og:image:secure_url" content="https://muhammadiqbalramadhan1201.github.io/PegawaiMAN/preview.png">
  <meta property="og:image:type" content="image/png">
  <meta property="og:type" content="website">
  <meta property="og:url" content="https://muhammadiqbalramadhan1201.github.io/PegawaiMAN/">

  <!-- Twitter -->

  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="Aplikasi Pegawai MAN">
  <meta name="twitter:description" content="Sistem informasi dan layanan kepegawaian.">
  <meta name="twitter:image" content="https://muhammadiqbalramadhan1201.github.io/PegawaiMAN/preview.png">

  <!-- PWA -->

  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="https://muhammadiqbalramadhan1201.github.io/PegawaiMAN/preview.png">

  <meta name="theme-color" content="#0B3D91">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

  <style>

    /* =====================================================
       RESET
       ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }


    /* =====================================================
       LAYAR MEMPROSES
       RINGAN DAN LANGSUNG MUNCUL
       ===================================================== */

    #processing-screen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      background: #ffffff;

      z-index: 2147483647;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.15s ease,
        visibility 0.15s ease;

      will-change: opacity;
    }

    #processing-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    /* =====================================================
       SPINNER MEMPROSES
       ===================================================== */

    .processing-spinner {
      width: 38px;
      height: 38px;

      border: 4px solid #E5E7EB;
      border-top-color: #0B3D91;

      border-radius: 50%;

      animation:
        processingSpin 0.7s linear infinite;

      margin-bottom: 13px;
    }

    @keyframes processingSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    /* =====================================================
       TEKS MEMPROSES
       ===================================================== */

    #processing-screen .processing-text {
      color: #0B3D91;

      font-size: 16px;

      font-weight: 600;

      letter-spacing: 0.1px;
    }


    /* =====================================================
       IFRAME APLIKASI
       ===================================================== */

    #app-frame {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;

      display: block;

      z-index: 1;

      background: #ffffff;
    }


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if ('serviceWorker' in navigator) {

      navigator.serviceWorker
        .register('sw.js')
        .catch(function(error) {

          console.warn(
            'Service Worker gagal:',
            error
          );

        });

    }


    /* =====================================================
       GEOLOCATION
       ===================================================== */

    window.addEventListener(
      'load',
      function() {

        if ('geolocation' in navigator) {

          navigator.geolocation.getCurrentPosition(

            function(pos) {

              console.log(
                'Lokasi diizinkan:',
                pos.coords
              );

            },

            function(err) {

              console.warn(
                'Akses lokasi ditolak:',
                err.message
              );

            }

          );

        }

      }
    );


    /* =====================================================
       PWA INSTALLATION
       ===================================================== */

    let deferredPrompt;


    const installOverlay =
      document.getElementById(
        'install-overlay'
      );


    const btnInstall =
      document.getElementById(
        'btn-install'
      );


    const btnClose =
      document.getElementById(
        'btn-close'
      );


    const isStandalone =
      window.matchMedia(
        '(display-mode: standalone)'
      ).matches ||
      window.navigator.standalone;


    if (!isStandalone) {

      window.addEventListener(
        'beforeinstallprompt',
        function(e) {


          /* Cegah prompt bawaan browser */

          e.preventDefault();


          /* Simpan event */

          deferredPrompt = e;


          /* Tampilkan popup */

          installOverlay.style.display =
            'flex';


          setTimeout(
            function() {

              installOverlay.classList
                .add('show');

            },
            10
          );

        }
      );

    }


    /* =====================================================
       TOMBOL INSTALL
       ===================================================== */

    btnInstall.onclick =
      async function() {


        hideModal();


        if (deferredPrompt) {

          deferredPrompt.prompt();


          const result =
            await deferredPrompt.userChoice;


          console.log(
            'Respon pengguna:',
            result.outcome
          );


          deferredPrompt = null;

        }

      };


    /* =====================================================
       TOMBOL NANTI SAJA
       ===================================================== */

    btnClose.onclick =
      function() {

        hideModal();

      };


    /* =====================================================
       SEMBUNYIKAN MODAL INSTALL
       ===================================================== */

    function hideModal() {

      installOverlay.classList
        .remove('show');


      setTimeout(
        function() {

          installOverlay.style.display =
            'none';

        },
        400
      );

    }

  </script>

</body>
</html>
