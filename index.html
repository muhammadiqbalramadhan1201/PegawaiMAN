  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    /* =========================
       IFRAME APLIKASI GAS
       ========================= */
    iframe {
      width: 100%;
      height: 100%;
      border: none;
      display: block;
      z-index: 1;
      position: relative;
    }

    /* =========================
       TOMBOL REFRESH
       ========================= */
    #refresh-button {
      position: fixed;
      top: 12px;
      right: 12px;
      width: 44px;
      height: 44px;
      border: none;
      border-radius: 12px;
      background: #4285F4;
      color: #ffffff;
      font-size: 28px;
      font-weight: bold;
      line-height: 44px;
      text-align: center;
      cursor: pointer;
      z-index: 9995;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.25);
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }

    #refresh-button:active {
      transform: scale(0.92);
      background: #2b6cb0;
    }

    #refresh-button.loading {
      pointer-events: none;
      opacity: 0.8;
    }

    /* =========================
       OVERLAY REFRESH
       ========================= */
    #refresh-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(0, 0, 0, 0.45);
      z-index: 9997;
      justify-content: center;
      align-items: center;
    }

    #refresh-overlay.show {
      display: flex;
    }

    #refresh-modal {
      width: 82%;
      max-width: 340px;
      background: #ffffff;
      border-radius: 18px;
      padding: 25px 20px;
      text-align: center;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
      animation: refreshPopup 0.25s ease;
    }

    @keyframes refreshPopup {
      from {
        transform: scale(0.85);
        opacity: 0;
      }
      to {
        transform: scale(1);
        opacity: 1;
      }
    }

    .refresh-loading-icon {
      width: 50px;
      height: 50px;
      margin: 0 auto 15px auto;
      border: 5px solid #e5e7eb;
      border-top-color: #4285F4;
      border-radius: 50%;
      animation: spinRefresh 0.8s linear infinite;
    }

    @keyframes spinRefresh {
      to {
        transform: rotate(360deg);
      }
    }

    #refresh-modal h3 {
      margin: 0;
      font-size: 17px;
      color: #222;
      font-weight: 600;
    }

    /* =========================
       INSTALL OVERLAY
       ========================= */
    #install-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(0, 0, 0, 0.7);
      z-index: 9998;
      justify-content: center;
      align-items: center;
      opacity: 0;
      transition: opacity 0.4s ease;
      pointer-events: none;
    }

    #install-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }

    /* =========================
       INSTALL MODAL
       ========================= */
    #install-modal {
      background: #ffffff;
      padding: 30px;
      border-radius: 20px;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
      text-align: center;
      width: 85%;
      max-width: 400px;
      transform: scale(0.8);
      transition: transform 0.4s ease;
    }

    #install-overlay.show #install-modal {
      transform: scale(1);
    }

    .app-icon-placeholder {
      width: 80px;
      height: 80px;
      margin: 0 auto 20px auto;
      background-color: #eee;
      border-radius: 18px;
      background-image: url('https://muhammadiqbalramadhan1201.github.io/PegawaiMAN/preview.png');
      background-size: cover;
      background-position: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.1);
    }

    #install-modal h2 {
      margin: 0 0 10px 0;
      font-size: 22px;
      color: #1c1e21;
    }

    #install-modal p {
      margin: 0 0 25px 0;
      font-size: 16px;
      color: #606770;
      line-height: 1.5;
    }

    /* =========================
       TOMBOL INSTALL
       ========================= */
    .action-buttons {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    #btn-install {
      background-color: #4285F4;
      color: white;
      border: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.2s;
    }

    #btn-install:active {
      background-color: #2b6cb0;
    }

    #btn-close {
      background: none;
      border: none;
      color: #777;
      font-size: 14px;
      padding: 10px;
      cursor: pointer;
      text-decoration: none;
    }
  </style>

<body>

  <!-- Iframe Google Apps Script -->
  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbzvlDBnQ4rWwIDX9KZAvQ1zgnSW9Fvzcn8hFl1twWkxW5xuP2sk3oLrkqjO2wgDtqwL/exec"
    allow="geolocation; camera; microphone">
  </iframe>

  <!-- =========================
       TOMBOL REFRESH
       ========================= -->
  <button id="refresh-button" aria-label="Refresh aplikasi" title="Refresh aplikasi">
    ↻
  </button>

  <!-- =========================
       POPUP REFRESH
       ========================= -->
  <div id="refresh-overlay">
    <div id="refresh-modal">
      <div class="refresh-loading-icon"></div>
      <h3>Sedang memuat ulang aplikasi...</h3>
    </div>
  </div>

  <!-- =========================
       POPUP INSTALASI PWA
       ========================= -->
  <div id="install-overlay">
    <div id="install-modal">
      <div class="app-icon-placeholder"></div>

      <h2>Install Aplikasi</h2>

      <p>
        Akses aplikasi ini lebih cepat dan mudah langsung dari layar utama HP Anda.
      </p>

      <div class="action-buttons">
        <button id="btn-install">
          Tambahkan ke Layar Utama
        </button>

        <button id="btn-close">
          Nanti Saja
        </button>
      </div>
    </div>
  </div>

  <script>
    /* =====================================================
       1. SERVICE WORKER & GEOLOCATION
       ===================================================== */

    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js');
    }

    window.addEventListener('load', () => {
      if ('geolocation' in navigator) {
        navigator.geolocation.getCurrentPosition(
          (pos) => console.log(
            'Lokasi diizinkan:',
            pos.coords
          ),
          (err) => console.warn(
            'Akses lokasi ditolak:',
            err.message
          )
        );
      }
    });


    /* =====================================================
       2. TOMBOL REFRESH APLIKASI
       ===================================================== */

    const refreshButton = document.getElementById('refresh-button');
    const refreshOverlay = document.getElementById('refresh-overlay');
    const appFrame = document.getElementById('app-frame');

    refreshButton.addEventListener('click', function () {

      // Mencegah tombol ditekan berkali-kali
      if (refreshButton.classList.contains('loading')) {
        return;
      }

      refreshButton.classList.add('loading');

      // Tampilkan popup
      refreshOverlay.classList.add('show');

      // Refresh isi Google Apps Script
      try {
        appFrame.src = appFrame.src;
      } catch (error) {
        console.error('Gagal refresh iframe:', error);
      }

      /*
       * Beri waktu agar aplikasi benar-benar mulai dimuat.
       * Popup kemudian ditutup setelah iframe selesai load.
       */
      let refreshTimeout = setTimeout(() => {
        refreshOverlay.classList.remove('show');
        refreshButton.classList.remove('loading');
      }, 5000);

      appFrame.addEventListener('load', function refreshFinished() {

        clearTimeout(refreshTimeout);

        setTimeout(() => {
          refreshOverlay.classList.remove('show');
          refreshButton.classList.remove('loading');
        }, 300);

        appFrame.removeEventListener('load', refreshFinished);

      }, { once: true });

    });


    /* =====================================================
       3. LOGIKA POP-UP MODAL INSTALASI PWA
       ===================================================== */

    let deferredPrompt;

    const installOverlay =
      document.getElementById('install-overlay');

    const btnInstall =
      document.getElementById('btn-install');

    const btnClose =
      document.getElementById('btn-close');


    // Cek apakah aplikasi dibuka dalam mode Standalone
    const isStandalone =
      window.matchMedia('(display-mode: standalone)').matches ||
      window.navigator.standalone;


    if (!isStandalone) {

      window.addEventListener(
        'beforeinstallprompt',
        (e) => {

          // Cegah prompt bawaan browser
          e.preventDefault();

          // Simpan event instalasi
          deferredPrompt = e;

          // Tampilkan Overlay & Modal
          installOverlay.style.display = 'flex';

          setTimeout(() => {
            installOverlay.classList.add('show');
          }, 10);

        }
      );

    }


    /* =====================================================
       4. EKSEKUSI INSTALASI
       ===================================================== */

    btnInstall.addEventListener(
      'click',
      async () => {

        hideModal();

        if (deferredPrompt) {

          deferredPrompt.prompt();

          const { outcome } =
            await deferredPrompt.userChoice;

          console.log(
            `Respon pengguna: ${outcome}`
          );

          deferredPrompt = null;

        }

      }
    );


    /* =====================================================
       5. TOMBOL NANTI SAJA
       ===================================================== */

    btnClose.addEventListener(
      'click',
      () => {
        hideModal();
      }
    );


    /* =====================================================
       6. FUNGSI SEMBUNYIKAN MODAL
       ===================================================== */

    function hideModal() {

      installOverlay.classList.remove('show');

      setTimeout(() => {

        installOverlay.style.display = 'none';

      }, 400);

    }

  </script>

</body>
</html>
