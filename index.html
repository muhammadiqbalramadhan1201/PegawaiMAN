  <style>

    /* =====================================================
       RESET
       ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }


    html,
    body {

      width: 100%;
      height: 100%;

      overflow: hidden;

      background: #ffffff;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }


    /* =====================================================
       LAYAR MEMPROSES
       ===================================================== */

    #processing-screen {

      position: fixed;

      inset: 0;

      width: 100%;
      height: 100%;

      background: #ffffff;

      z-index: 2147483647;

      display: flex;

      align-items: center;

      justify-content: center;

      flex-direction: column;

      opacity: 1;

      visibility: visible;

      transition:
        opacity 0.15s ease,
        visibility 0.15s ease;

      will-change: opacity;
    }


    #processing-screen.hide {

      opacity: 0;

      visibility: hidden;

      pointer-events: none;
    }


    /* =====================================================
       SPINNER MEMPROSES
       ===================================================== */

    .processing-spinner {

      width: 38px;
      height: 38px;

      border: 4px solid #E5E7EB;

      border-top-color: #0B3D91;

      border-radius: 50%;

      animation:
        processingSpin 0.7s linear infinite;

      margin-bottom: 13px;
    }


    @keyframes processingSpin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    /* =====================================================
       TEKS MEMPROSES
       ===================================================== */

    #processing-screen .processing-text {

      color: #0B3D91;

      font-size: 16px;

      font-weight: 600;

      letter-spacing: 0.1px;
    }


    /* =====================================================
       IFRAME APLIKASI
       ===================================================== */

    #app-frame {

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;

      display: block;

      z-index: 1;

      background: #ffffff;
    }


    /* =====================================================
       INSTALL OVERLAY
       ===================================================== */

    #install-overlay {

      display: none;

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background-color:
        rgba(0, 0, 0, 0.7);

      z-index: 9998;

      justify-content: center;

      align-items: center;

      opacity: 0;

      transition:
        opacity 0.4s ease;

      pointer-events: none;
    }


    #install-overlay.show {

      opacity: 1;

      pointer-events: auto;
    }


    /* =====================================================
       INSTALL MODAL
       ===================================================== */

    #install-modal {

      background: #FFFFFF;

      padding: 30px;

      border-radius: 20px;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.5);

      text-align: center;

      width: 85%;

      max-width: 400px;

      transform: scale(0.8);

      transition:
        transform 0.4s ease;
    }


    #install-overlay.show #install-modal {

      transform: scale(1);
    }


    /* =====================================================
       ICON INSTALL
       ===================================================== */

    .app-icon-placeholder {

      width: 80px;
      height: 80px;

      margin:
        0 auto 20px auto;

      background-color:
        #EEEEEE;

      border-radius: 18px;

      background-image:
        url(
          'https://muhammadiqbalramadhan1201.github.io/PegawaiMAN/preview.png'
        );

      background-size: cover;

      background-position: center;

      box-shadow:
        0 4px 10px rgba(0,0,0,0.1);
    }


    #install-modal h2 {

      margin:
        0 0 10px 0;

      font-size: 22px;

      color: #1c1e21;
    }


    #install-modal p {

      margin:
        0 0 25px 0;

      font-size: 16px;

      color: #606770;

      line-height: 1.5;
    }


    /* =====================================================
       TOMBOL INSTALL
       ===================================================== */

    .action-buttons {

      display: flex;

      flex-direction: column;

      gap: 12px;
    }


    #btn-install {

      background-color:
        #4285F4;

      color: #FFFFFF;

      border: none;

      padding: 15px;

      border-radius: 12px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }


    #btn-install:active {

      background-color:
        #2b6cb0;
    }


    #btn-close {

      background: none;

      border: none;

      color: #777777;

      font-size: 14px;

      padding: 10px;

      cursor: pointer;

      text-decoration: none;
    }


    /* =====================================================
       TAMPILAN HP
       ===================================================== */

    @media (max-width: 600px) {

      .processing-spinner {

        width: 36px;

        height: 36px;
      }


      #processing-screen .processing-text {

        font-size: 15px;
      }

    }

  <div id="install-overlay">

```
<div id="install-modal">

  <div class="app-icon-placeholder"></div>

  <h2>
    Install Aplikasi
  </h2>

  <p>
    Akses aplikasi ini lebih cepat dan mudah langsung
    dari layar utama HP Anda.
  </p>

  <div class="action-buttons">

    <button id="btn-install" type="button">
      Tambahkan ke Layar Utama
    </button>

    <button id="btn-close" type="button">
      Nanti Saja
    </button>

  </div>

</div>
```

  </div>

  <script>


    /* =====================================================
       LAYAR MEMPROSES
       ===================================================== */

    const processingScreen =
      document.getElementById(
        'processing-screen'
      );


    const appFrame =
      document.getElementById(
        'app-frame'
      );


    /*
     * Begitu iframe selesai dimuat,
     * layar "Membuka Aplikasi..." disembunyikan.
     */

    appFrame.addEventListener(
      'load',
      function() {

        processingScreen.classList.add(
          'hide'
        );

      },
      {
        once: false
      }
    );


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if ('serviceWorker' in navigator) {

      navigator.serviceWorker
        .register('sw.js')
        .catch(function(error) {

          console.warn(
            'Service Worker gagal:',
            error
          );

        });

    }


    /* =====================================================
       GEOLOCATION
       ===================================================== */

    window.addEventListener(
      'load',
      function() {

        if (
          'geolocation'
          in navigator
        ) {

          navigator.geolocation.getCurrentPosition(

            function(pos) {

              console.log(
                'Lokasi diizinkan:',
                pos.coords
              );

            },

            function(err) {

              console.warn(
                'Akses lokasi ditolak:',
                err.message
              );

            }

          );

        }

      }
    );


    /* =====================================================
       PWA INSTALLATION
       ===================================================== */

    let deferredPrompt = null;


    const installOverlay =
      document.getElementById(
        'install-overlay'
      );


    const btnInstall =
      document.getElementById(
        'btn-install'
      );


    const btnClose =
      document.getElementById(
        'btn-close'
      );


    /* =====================================================
       CEK MODE STANDALONE
       ===================================================== */

    const isStandalone =

      window.matchMedia(
        '(display-mode: standalone)'
      ).matches

      ||

      window.navigator.standalone;


    /* =====================================================
       EVENT INSTALL PWA
       ===================================================== */

    if (!isStandalone) {

      window.addEventListener(
        'beforeinstallprompt',
        function(e) {

          /*
           * Cegah prompt bawaan browser
           */

          e.preventDefault();


          /*
           * Simpan event untuk tombol install
           */

          deferredPrompt = e;


          /*
           * Tampilkan popup install
           */

          installOverlay.style.display =
            'flex';


          setTimeout(
            function() {

              installOverlay.classList.add(
                'show'
              );

            },
            10
          );

        }
      );

    }


    /* =====================================================
       TOMBOL INSTALL
       ===================================================== */

    btnInstall.onclick =
      async function() {

        /*
         * Tutup popup terlebih dahulu
         */

        hideModal();


        /*
         * Jika browser mendukung install prompt
         */

        if (deferredPrompt) {

          deferredPrompt.prompt();


          const result =
            await deferredPrompt.userChoice;


          console.log(
            'Respon pengguna:',
            result.outcome
          );


          /*
           * Event hanya boleh digunakan sekali
           */

          deferredPrompt = null;

        }

      };


    /* =====================================================
       TOMBOL NANTI SAJA
       ===================================================== */

    btnClose.onclick =
      function() {

        hideModal();

      };


    /* =====================================================
       SEMBUNYIKAN MODAL INSTALL
       ===================================================== */

    function hideModal() {

      installOverlay.classList.remove(
        'show'
      );


      setTimeout(
        function() {

          installOverlay.style.display =
            'none';

        },
        400
      );

    }


    /* =====================================================
       SELESAI
       ===================================================== */

  </script>
