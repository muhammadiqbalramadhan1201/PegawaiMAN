  <style>

    /* =====================================================
       RESET
       ===================================================== */

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #ffffff;
      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Helvetica,
        Arial,
        sans-serif;
    }


    /* =====================================================
       LAYAR MEMPROSES
       RINGAN DAN LANGSUNG MUNCUL
       ===================================================== */

    #processing-screen {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      background: #ffffff;

      z-index: 2147483647;

      display: flex;
      align-items: center;
      justify-content: center;
      flex-direction: column;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.15s ease,
        visibility 0.15s ease;

      will-change: opacity;
    }

    #processing-screen.hide {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }


    /* =====================================================
       SPINNER MEMPROSES
       ===================================================== */

    .processing-spinner {
      width: 38px;
      height: 38px;

      border: 4px solid #E5E7EB;
      border-top-color: #0B3D91;

      border-radius: 50%;

      animation:
        processingSpin 0.7s linear infinite;

      margin-bottom: 13px;
    }

    @keyframes processingSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }


    /* =====================================================
       TEKS MEMPROSES
       ===================================================== */

    #processing-screen .processing-text {
      color: #0B3D91;

      font-size: 16px;

      font-weight: 600;

      letter-spacing: 0.1px;
    }


    /* =====================================================
       IFRAME APLIKASI
       ===================================================== */

    #app-frame {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      border: none;

      display: block;

      z-index: 1;

      background: #ffffff;
    }


    /* =====================================================
       TOMBOL REFRESH FLOATING
       ===================================================== */

    #refresh-button {
      position: fixed !important;

      right: 20px !important;
      bottom: 20px !important;

      top: auto !important;
      left: auto !important;

      width: 54px !important;
      height: 54px !important;

      min-width: 54px !important;
      min-height: 54px !important;

      max-width: 54px !important;
      max-height: 54px !important;

      border: 0 !important;
      outline: none !important;

      border-radius: 50% !important;

      background: #0B3D91 !important;

      color: #FFFFFF !important;

      font-family: Arial, sans-serif !important;

      font-size: 32px !important;

      font-weight: normal !important;

      line-height: 54px !important;

      text-align: center !important;

      padding: 0 !important;

      margin: 0 !important;

      cursor: pointer !important;

      z-index: 2147483647 !important;

      display: flex !important;

      align-items: center !important;

      justify-content: center !important;

      visibility: visible !important;

      opacity: 1 !important;

      box-shadow:
        0 4px 15px rgba(0, 0, 0, 0.35) !important;

      -webkit-appearance: none !important;
      appearance: none !important;

      -webkit-tap-highlight-color: transparent;

      user-select: none;

      transition:
        transform 0.15s ease,
        background-color 0.15s ease;
    }

    #refresh-button:active {
      transform: scale(0.88) !important;
      background: #062B68 !important;
    }

    #refresh-button.refreshing {
      pointer-events: none;
      opacity: 0.75 !important;
    }


    /* =====================================================
       POPUP REFRESH
       ===================================================== */

    #refresh-overlay {
      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background:
        rgba(0, 0, 0, 0.45);

      z-index: 2147483646;

      display: none;

      align-items: center;
      justify-content: center;
    }

    #refresh-overlay.show {
      display: flex;
    }


    /* =====================================================
       KOTAK REFRESH
       ===================================================== */

    #refresh-modal {
      width: 85%;

      max-width: 350px;

      background: #FFFFFF;

      border-radius: 18px;

      padding: 28px 20px;

      text-align: center;

      box-shadow:
        0 10px 30px rgba(0, 0, 0, 0.30);

      animation:
        refreshPopup 0.25s ease;
    }

    @keyframes refreshPopup {
      from {
        transform: scale(0.85);
        opacity: 0;
      }

      to {
        transform: scale(1);
        opacity: 1;
      }
    }


    /* =====================================================
       LOADING SPINNER REFRESH
       ===================================================== */

    .refresh-loading-icon {
      width: 48px;
      height: 48px;

      margin:
        0 auto 16px auto;

      border:
        5px solid #E5E7EB;

      border-top-color:
        #0B3D91;

      border-radius: 50%;

      animation:
        refreshSpin 0.8s linear infinite;
    }

    @keyframes refreshSpin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    #refresh-modal h3 {
      margin: 0;

      font-size: 17px;

      font-weight: 600;

      color: #222222;
    }


    /* =====================================================
       INSTALL OVERLAY
       ===================================================== */

    #install-overlay {
      display: none;

      position: fixed;

      top: 0;
      left: 0;

      width: 100%;
      height: 100%;

      background-color:
        rgba(0, 0, 0, 0.7);

      z-index: 9998;

      justify-content: center;
      align-items: center;

      opacity: 0;

      transition:
        opacity 0.4s ease;

      pointer-events: none;
    }

    #install-overlay.show {
      opacity: 1;
      pointer-events: auto;
    }


    /* =====================================================
       INSTALL MODAL
       ===================================================== */

    #install-modal {
      background: #FFFFFF;

      padding: 30px;

      border-radius: 20px;

      box-shadow:
        0 10px 25px rgba(0,0,0,0.5);

      text-align: center;

      width: 85%;

      max-width: 400px;

      transform: scale(0.8);

      transition:
        transform 0.4s ease;
    }

    #install-overlay.show #install-modal {
      transform: scale(1);
    }


    /* =====================================================
       ICON INSTALL
       ===================================================== */

    .app-icon-placeholder {
      width: 80px;
      height: 80px;

      margin:
        0 auto 20px auto;

      background-color:
        #EEEEEE;

      border-radius: 18px;

      background-image:
        url('https://muhammadiqbalramadhan1201.github.io/PegawaiMAN/preview.png');

      background-size: cover;

      background-position: center;

      box-shadow:
        0 4px 10px rgba(0,0,0,0.1);
    }

    #install-modal h2 {
      margin:
        0 0 10px 0;

      font-size: 22px;

      color: #1c1e21;
    }

    #install-modal p {
      margin:
        0 0 25px 0;

      font-size: 16px;

      color: #606770;

      line-height: 1.5;
    }


    /* =====================================================
       TOMBOL INSTALL
       ===================================================== */

    .action-buttons {
      display: flex;

      flex-direction: column;

      gap: 12px;
    }

    #btn-install {
      background-color:
        #4285F4;

      color: #FFFFFF;

      border: none;

      padding: 15px;

      border-radius: 12px;

      font-size: 16px;

      font-weight: bold;

      cursor: pointer;
    }

    #btn-install:active {
      background-color:
        #2b6cb0;
    }

    #btn-close {
      background: none;

      border: none;

      color: #777777;

      font-size: 14px;

      padding: 10px;

      cursor: pointer;

      text-decoration: none;
    }


    /* =====================================================
       TAMPILAN HP
       ===================================================== */

    @media (max-width: 600px) {

      #refresh-button {
        right: 15px !important;

        bottom: 15px !important;

        width: 52px !important;

        height: 52px !important;

        min-width: 52px !important;

        min-height: 52px !important;

        max-width: 52px !important;

        max-height: 52px !important;

        font-size: 30px !important;
      }

      .processing-spinner {
        width: 36px;
        height: 36px;
      }

      #processing-screen .processing-text {
        font-size: 15px;
      }
    }

  </style>

</head>

<body>

  <!-- =====================================================

       ===================================================== -->

  <div id="processing-screen">

<div class="processing-spinner"></div>

<div class="processing-text">

  <!-- =====================================================

  <iframe
    id="app-frame"
    src="https://script.google.com/macros/s/AKfycbzvlDBnQ4rWwIDX9KZAvQ1zgnSW9Fvzcn8hFl1twWkxW5xuP2sk3oLrkqjO2wgDtqwL/exec"

  </button>

  <!-- =====================================================
       POPUP REFRESH
       ===================================================== -->

  <div id="refresh-overlay">

<div id="refresh-modal">

  <div class="refresh-loading-icon"></div>

  <h3>
    Sedang memuat ulang aplikasi...
  </h3>

</div>

  </div>

  <!-- =====================================================
       POPUP INSTALLASI
       ===================================================== -->

  <div id="install-overlay">

<div id="install-modal">

  <div class="app-icon-placeholder"></div>

  <h2>
    Install Aplikasi
  </h2>

  <p>
    Akses aplikasi ini lebih cepat dan mudah langsung dari layar utama HP Anda.
  </p>

  <div class="action-buttons">

    <button id="btn-install">
      Tambahkan ke Layar Utama
    </button>

    <button id="btn-close">
      Nanti Saja
    </button>

  </div>

</div>

  </div>

  <script>


    /* =====================================================
       LAYAR MEMPROSES
       ===================================================== */

    const processingScreen =
      document.getElementById(
        'processing-screen'
      );

    const appFrame =
      document.getElementById(
        'app-frame'
      );


    /*
     * Begitu iframe selesai dimuat,
     * layar Memproses langsung disembunyikan.
     *
     * Tidak ada delay tambahan.
     */

    appFrame.addEventListener(
      'load',
      function() {

        processingScreen.classList
          .add('hide');

      },
      { once: false }
    );


    /* =====================================================
       SERVICE WORKER
       ===================================================== */

    if ('serviceWorker' in navigator) {

      navigator.serviceWorker
        .register('sw.js')
        .catch(function(error) {

          console.warn(
            'Service Worker gagal:',
            error
          );

        });

    }


    /* =====================================================
       GEOLOCATION
       ===================================================== */

    window.addEventListener(
      'load',
      function() {

        if ('geolocation' in navigator) {

          navigator.geolocation.getCurrentPosition(

            function(pos) {

              console.log(
                'Lokasi diizinkan:',
                pos.coords
              );

            },

            function(err) {

              console.warn(
                'Akses lokasi ditolak:',
                err.message
              );

            }

          );

        }

      }
    );


    /* =====================================================
       REFRESH APLIKASI
       ===================================================== */

    const refreshButton =
      document.getElementById(
        'refresh-button'
      );

    const refreshOverlay =
      document.getElementById(
        'refresh-overlay'
      );


    refreshButton.onclick =
      function() {


        /* Cegah klik berkali-kali */

        if (
          refreshButton.classList
            .contains('refreshing')
        ) {

          return;

        }


        /* Tandai sedang refresh */

        refreshButton.classList
          .add('refreshing');


        /* Tampilkan popup */

        refreshOverlay.classList
          .add('show');


        /*
         * Paksa iframe memuat ulang.
         * Parameter timestamp mencegah cache.
         */

        const baseURL =
          'https://script.google.com/macros/s/AKfycbzvlDBnQ4rWwIDX9KZAvQ1zgnSW9Fvzcn8hFl1twWkxW5xuP2sk3oLrkqjO2wgDtqwL/exec';


        appFrame.src =
          baseURL +
          '?refresh=' +
          Date.now();


        /*
         * Popup minimal tampil
         * selama 1,5 detik.
         */

        setTimeout(
          function() {

            refreshOverlay.classList
              .remove('show');

            refreshButton.classList
              .remove('refreshing');

          },
          1500
        );

      };


    /* =====================================================
       PWA INSTALLATION
       ===================================================== */

    let deferredPrompt;


    const installOverlay =
      document.getElementById(
        'install-overlay'
      );


    const btnInstall =
      document.getElementById(
        'btn-install'
      );


    const btnClose =
      document.getElementById(
        'btn-close'
      );


    const isStandalone =
      window.matchMedia(
        '(display-mode: standalone)'
      ).matches ||
      window.navigator.standalone;


    if (!isStandalone) {

      window.addEventListener(
        'beforeinstallprompt',
        function(e) {


          /* Cegah prompt bawaan browser */

          e.preventDefault();


          /* Simpan event */

          deferredPrompt = e;


          /* Tampilkan popup */

          installOverlay.style.display =
            'flex';


          setTimeout(
            function() {

              installOverlay.classList
                .add('show');

            },
            10
          );

        }
      );

    }


    /* =====================================================
       TOMBOL INSTALL
       ===================================================== */

    btnInstall.onclick =
      async function() {


        hideModal();


        if (deferredPrompt) {

          deferredPrompt.prompt();


          const result =
            await deferredPrompt.userChoice;


          console.log(
            'Respon pengguna:',
            result.outcome
          );


          deferredPrompt = null;

        }

      };


    /* =====================================================
       TOMBOL NANTI SAJA
       ===================================================== */

    btnClose.onclick =
      function() {

        hideModal();

      };


    /* =====================================================
       SEMBUNYIKAN MODAL INSTALL
       ===================================================== */

    function hideModal() {

      installOverlay.classList
        .remove('show');


      setTimeout(
        function() {

          installOverlay.style.display =
            'none';

        },
        400
      );

    }

  </script>

</body>
